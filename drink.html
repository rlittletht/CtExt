<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><title>Drink Wines</title>
    <style>
        body
        {
            font: 14px system-ui, sans-serif;
            width: 370px;
            margin: 16px;
            color: #222
        }

        h1
        {
            font-size: 18px;
            margin: 0 0 12px
        }

        button
        {
            margin: 6px 6px 0 0;
            padding: 7px 10px
        }

        button:disabled
        {
            opacity: .45
        }

        pre
        {
            white-space: pre-wrap;
            max-height: 210px;
            overflow: auto;
            background: #f4f4f4;
            padding: 9px
        }

        #error
        {
            color: #a00
        }

        #status
        {
            color: #174c2c
        }
    </style>
</head>
<body>
<h1>Drink Wines</h1>
<p>Open a logged-in CellarTracker tab, then paste <code>scancode,iwine,drinkdate,notes</code> rows below.</p>
<button id="back">Back</button>
<label for="drinkCsv" style="font-size: 13px; margin: 6px 0">Paste scancode,iwine,drinkdate,notes:</label>
<textarea id="drinkCsv" rows="8" style="width:100%;box-sizing:border-box" placeholder="223227674,5545276,9/27/2026,test"></textarea>
<div id="error" role="alert"></div>
<button id="drink">Drink entries</button>
<div id="status" role="status"></div><pre id="log"></pre>
<script src="drink.js"></script>
</body>
</html>
